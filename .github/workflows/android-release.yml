name: Android Signed Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build signed release in GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Require signing secrets
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]             || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android release signing secrets are incomplete."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platforms;android-36"             "build-tools;36.0.0"             "platform-tools"

      - name: Decode release keystore
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Prepare pinned bundled PP-OCRv6 Medium models
        shell: bash
        run: |
          chmod +x scripts/prepare-ocr-models.sh
          scripts/prepare-ocr-models.sh

      - name: Build signed APK and AAB
        run: |
          gradle wrapper --gradle-version 9.4.1
          chmod +x gradlew
          ./gradlew --no-daemon clean :core:test :app:lintRelease :app:assembleRelease :app:bundleRelease

      - name: Audit signed APK and package release
        shell: bash
        run: |
          mkdir -p release-package
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT2" dump permissions "$APK" | tee release-package/apk-permissions.txt
          if grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE|AD_ID)' release-package/apk-permissions.txt; then
            echo "Forbidden network, analytics, or advertising permission detected."
            exit 1
          fi
          cp "$APK" "release-package/BIMO-Easy-to-Read-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab             "release-package/BIMO-Easy-to-Read-${GITHUB_REF_NAME}.aab"
          zip -qr "release-package/BIMO-Easy-to-Read-${GITHUB_REF_NAME}-source.zip" .             -x '.git/*' '.gradle/*' '*/build/*' 'release-package/*' 'paddle-sdk/src/main/assets/models/*.onnx'
          sha256sum release-package/*.apk release-package/*.aab release-package/*.zip             > release-package/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             release-package/*             --title "BIMO Easy to Read $GITHUB_REF_NAME"             --generate-notes
