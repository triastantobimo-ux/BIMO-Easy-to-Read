name: Android Cloud Build

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platforms;android-36"             "build-tools;36.0.0"             "platform-tools"

      - name: Generate pinned Gradle Wrapper
        run: gradle wrapper --gradle-version 9.4.1

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean             :core:test             :app:testDebugUnitTest             :app:lintDebug             :app:assembleDebug             :app:assembleRelease             :app:bundleRelease

      - name: Export dependency evidence
        run: |
          mkdir -p audit
          ./gradlew --no-daemon :app:dependencies             --configuration releaseRuntimeClasspath > audit/release-dependencies.txt

      - name: Audit APK permissions
        shell: bash
        run: |
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$AAPT2" dump permissions "$APK" | tee audit/apk-permissions.txt
          if grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE|AD_ID)' audit/apk-permissions.txt; then
            echo "Forbidden network, analytics, or advertising permission detected."
            exit 1
          fi

      - name: Package cloud artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/BIMO-Easy-to-Read-debug.apk
          cp app/build/outputs/apk/release/*.apk artifacts/
          cp app/build/outputs/bundle/release/*.aab artifacts/
          cp -r audit artifacts/audit
          zip -qr artifacts/BIMO-Easy-to-Read-source.zip .             -x '.git/*' '.gradle/*' '*/build/*' 'artifacts/*'
          sha256sum artifacts/*.apk artifacts/*.aab artifacts/*.zip > artifacts/SHA256SUMS.txt

      - name: Upload build package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIMO-Easy-to-Read-${{ github.sha }}
          path: |
            artifacts/
            app/build/reports/
            core/build/reports/tests/
          if-no-files-found: warn
          retention-days: 30
