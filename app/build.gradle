plugins {
    id 'com.android.application'
}

def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def targetAbi = (project.findProperty('targetAbi') ?: 'arm64-v8a').toString()
def allowedTargetAbis = ['arm64-v8a', 'x86_64']
if (!allowedTargetAbis.contains(targetAbi)) {
    throw new GradleException("Unsupported targetAbi '${targetAbi}'. Allowed values: ${allowedTargetAbis.join(', ')}")
}

android {
    namespace 'com.bimo.easytoread'
    compileSdk 36

    defaultConfig {
        applicationId 'com.bimo.easytoread'
        minSdk 31
        targetSdk 36
        versionCode 9
        versionName '0.7.1-pdf-reader-ux'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        ndk {
            abiFilters targetAbi
        }
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE.md',
                'META-INF/LICENSE-notice.md'
            ]
        }
    }

    lint {
        htmlReport true
        textReport true
        textOutput file("$buildDir/reports/lint-results-debug.txt")
    }
}

dependencies {
    implementation project(':core')
    implementation project(':paddle-sdk')
    implementation 'com.quickbirdstudios:opencv:4.5.3'

    // Bundled Latin OCR model: no runtime model download and no cloud OCR call.
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // Phase 1 PDF workspace. PDFium is packaged in the APK; no SDK Extension
    // or separately installed PDF component is required at runtime.
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'io.legere:pdfiumandroid:1.0.33'

    testImplementation 'junit:junit:4.13.2'
}
